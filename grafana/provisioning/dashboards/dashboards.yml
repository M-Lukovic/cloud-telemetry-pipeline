apiVersion: 1

providers:
  - name: Infrastructure and Equipment Telemetry
    orgId: 1
    folder: Telemetry
    folderUid: telemetry
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 10
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false

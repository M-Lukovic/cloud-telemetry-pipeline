version: '3.8'

services:
  app:
    build: ./app
    container_name: telemetry_app
    restart: always
    networks:
      - telemetry_net

  nginx:
    image: nginx:alpine
    container_name: telemetry_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - telemetry_net

  prometheus:
    image: prom/prometheus:latest
    container_name: telemetry_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app
    networks:
      - telemetry_net

  grafana:
    image: grafana/grafana:latest
    container_name: telemetry_grafana
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - telemetry_net

networks:
  telemetry_net:
    driver: bridge
